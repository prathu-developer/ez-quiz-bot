<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrance Trial</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --glass-bg: rgba(0, 0, 0, 0.25);
            --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1f9c54, #b4e036);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* ✨ CHANGE THIS BACK TO CENTER */
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        .group-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
        }
        .group-info h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }
        .group-info p {
            margin: 2px 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .progress-header svg {
            width: 14px;
            height: 14px;
            margin-right: 6px;
            fill: currentColor;
        }
        .progress-bars {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
        }
        .bar {
            height: 3px;
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        .bar.active {
            background: #ffffff;
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: var(--btn-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 🟢 CORRECT STATE (Matching Photo 1) */
        .option-btn.correct {
            background: rgba(46, 204, 113, 0.9);
            border-color: rgba(46, 204, 113, 1);
        }
        .badge-icon {
            display: none;
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .option-btn.correct .badge-icon.check {
            display: block;
        }

        /* 🔴 ERROR STATE (Matching Photo 2) */
        .option-btn.error {
            background: rgba(219, 78, 64, 0.9);
            border-color: rgba(219, 78, 64, 1);
            animation: shake 0.4s;
        }
        .option-btn.error .badge-icon.cross {
            display: block;
        }

        .warning-msg {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 500;
            margin-top: 24px;
            opacity: 0;
            transition: opacity 0.3s;
            height: 20px;
        }
        .warning-msg.show {
            opacity: 1;
        }

        #loading-overlay {
            display: none;
            text-align: center;
            margin-top: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="glass-card" id="main-card">
        <div class="header">
            <div class="group-icon">🪄</div>
            <div class="group-info">
                <h2>Ez Editorials</h2>
                <p>Answer quick questions to join the group.</p>
            </div>
        </div>

        <div class="progress-header">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            BOT QUIZ · Question <span id="q-num">1</span> of 10
        </div>
        <div class="progress-bars" id="progress-bars"></div>

        <div class="question-text" id="question-text">Loading...</div>

        <div class="options-container" id="options-container"></div>
        
        <div class="warning-msg" id="warning-msg">⚠️ Not quite. Try again.</div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2 style="margin:0; font-size: 18px;">Approving Request...</h2>
    </div>

    <script>
        window.Telegram.WebApp.ready();

        const questions = [
            { q: "Choose the correct synonym for 'Genuine'.", opts: ["Fake", "Authentic", "False", "Artificial"], ans: 1 },
            { q: "Complete the sentence: 'She is exceptionally good ___ mathematics.'", opts: ["in", "on", "at", "with"], ans: 2 },
            { q: "Identify the correctly spelt word.", opts: ["Favourate", "Favourite", "Faverite", "Favurite"], ans: 1 },
            { q: "What is the exact antonym of the word 'Abundant'?", opts: ["Plentiful", "Scarce", "Heavy", "Rich"], ans: 1 },
            { q: "What does the idiom 'A piece of cake' mean?", opts: ["Something very difficult", "A sweet dessert", "Something easily achieved", "A heavy burden"], ans: 2 },
            { q: "Choose the correct article: 'He is ___ honest man.'", opts: ["a", "an", "the", "no article required"], ans: 1 },
            { q: "Complete the sentence: 'The train ___ the station before we arrived.'", opts: ["left", "leaves", "had left", "leaving"], ans: 2 },
            { q: "A person who does not believe in the existence of God is known as an...", opts: ["Theist", "Atheist", "Agnostic", "Optimist"], ans: 1 },
            { q: "Choose the correct plural form of the word 'Child'.", opts: ["Childs", "Childes", "Children", "Childrens"], ans: 2 },
            { q: "Identify the correctly spelt word.", opts: ["Travelled", "Traveled", "Travellled", "Travelld"], ans: 0 }
        ];

        // ✨ PRO FEATURE: Completely shuffle the questions every single time the Mini App opens
        questions.sort(() => Math.random() - 0.5);

        let currentQuestion = 0;
        let isProcessingTap = false; // Prevents spam-clicking

        function renderProgress() {
            document.getElementById('q-num').innerText = currentQuestion + 1;
            const barContainer = document.getElementById('progress-bars');
            barContainer.innerHTML = '';
            for(let i = 0; i < questions.length; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar ' + (i <= currentQuestion ? 'active' : '');
                barContainer.appendChild(bar);
            }
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                finishQuiz();
                return;
            }
            
            isProcessingTap = false;
            document.getElementById('warning-msg').classList.remove('show');
            renderProgress();
            
            const qData = questions[currentQuestion];
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            qData.opts.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span>${opt}</span>
                    <span class="badge-icon check">✓</span>
                    <span class="badge-icon cross">✕</span>
                `;
                
                btn.onclick = () => handleTap(btn, index, qData.ans);
                optionsContainer.appendChild(btn);
            });
        }

        function handleTap(btn, selectedIndex, correctIndex) {
            if (isProcessingTap) return;

            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('error');
                b.classList.remove('correct');
            });
            document.getElementById('warning-msg').classList.remove('show');

            if (selectedIndex === correctIndex) {
                isProcessingTap = true;
                btn.classList.add('correct'); // Turns Green + Shows ✓

                if (window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }

                // 400ms pause so the user clearly sees the green checkmark!
                setTimeout(() => {
                    currentQuestion++;
                    loadQuestion();
                }, 400);

            } else {
                btn.classList.add('error'); // Turns Red + Shows ✕
                document.getElementById('warning-msg').classList.add('show');

                if (window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                }
            }
        }

        function finishQuiz() {
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'block';

            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }

            const initDataUnsafe = window.Telegram.WebApp.initDataUnsafe;
            const userId = initDataUnsafe.user ? initDataUnsafe.user.id : null;

            if (userId) {
                fetch('https://ez-editorials-bot.onrender.com/api/approve_captcha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                }).then(() => {
                    setTimeout(() => window.Telegram.WebApp.close(), 800);
                }).catch(err => {
                    alert("Connection error. Please try again.");
                });
            } else {
                alert("Please open this inside Telegram.");
            }
        }

        loadQuestion();
    </script>
</body>
</html>
