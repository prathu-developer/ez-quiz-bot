<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrance Trial</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        #quiz-container {
            width: 100%;
            max-width: 400px;
        }
        .progress {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .question {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .option-btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .option-btn:active {
            opacity: 0.7;
        }
        #loading {
            display: none;
            font-size: 18px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #3390ec);
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <div class="progress" id="progress-text">BOT QUIZ - Question 1 of 10</div>
        <div class="question" id="question-text">Loading...</div>
        <div id="options-container"></div>
    </div>
    
    <div id="loading">✨ Verifying your magic...</div>

    <script>
        // Initialize Telegram Web App
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const questions = [
            { q: "Choose the correct synonym for 'Genuine'.", opts: ["Fake", "Authentic", "False", "Artificial"] },
            { q: "Complete the sentence: 'She is exceptionally good ___ mathematics.'", opts: ["in", "on", "at", "with"] },
            { q: "Identify the correctly spelt word.", opts: ["Favourate", "Favourite", "Faverite", "Favurite"] },
            { q: "What is the exact antonym of the word 'Abundant'?", opts: ["Plentiful", "Scarce", "Heavy", "Rich"] },
            { q: "What does the idiom 'A piece of cake' mean?", opts: ["Something very difficult", "A sweet dessert", "Something easily achieved", "A heavy burden"] },
            { q: "Choose the correct article: 'He is ___ honest man.'", opts: ["a", "an", "the", "no article required"] },
            { q: "Complete the sentence: 'The train ___ the station before we arrived.'", opts: ["left", "leaves", "had left", "leaving"] },
            { q: "A person who does not believe in the existence of God is known as an...", opts: ["Theist", "Atheist", "Agnostic", "Optimist"] },
            { q: "Choose the correct plural form of the word 'Child'.", opts: ["Childs", "Childes", "Children", "Childrens"] },
            { q: "Identify the correctly spelt word.", opts: ["Travelled", "Traveled", "Travellled", "Travelld"] }
        ];

        let currentQuestion = 0;

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                finishQuiz();
                return;
            }

            const qData = questions[currentQuestion];
            document.getElementById('progress-text').innerText = `BOT QUIZ - Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Clear old buttons

            qData.opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    currentQuestion++;
                    loadQuestion();
                };
                optionsContainer.appendChild(btn);
            });
        }

        function finishQuiz() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Get user ID safely from Telegram context
            const initDataUnsafe = window.Telegram.WebApp.initDataUnsafe;
            const userId = initDataUnsafe.user ? initDataUnsafe.user.id : null;

            if (userId) {
                // Send success signal back to your Python server
                fetch('/api/approve_captcha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                }).then(() => {
                    // Close the Mini App instantly upon success
                    window.Telegram.WebApp.close();
                }).catch(err => {
                    alert("Connection error. Please try again.");
                });
            } else {
                // Fallback if opened outside Telegram
                alert("Please open this inside Telegram.");
            }
        }

        // Start the trial
        loadQuestion();
    </script>
</body>
</html>
