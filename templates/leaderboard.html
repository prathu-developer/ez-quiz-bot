<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Great Hall</title>
    
    <!-- External Libraries -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ⚡ FREE ZERO-BANDWIDTH CDN DELIVERY -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/prathu-developer/ez-editorials-assets@main/style.css">
    <script src="https://cdn.jsdelivr.net/gh/prathu-developer/ez-editorials-assets@main/app_v2.js" defer></script>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="active-count-pill">👥 <span id="activeCount">--</span></div>
        <div class="header-title">🏆 The Great Hall</div>
        <div class="timer-sub-header">SEASON <span id="weekNumber">--</span> • ENDS IN <span id="timeRemainingHead" style="color: #fff;">--</span></div>
    </div>

    <!-- MAIN LEADERBOARD LIST -->
    <div class="leaderboard-container" id="list">
        <div style="text-align: center; color: #8c939d; margin-top: 30px;">Fetching magical records...</div>
    </div>

    <!-- FLOATING SCROLL BUTTON & FOOTER -->
    <div class="floating-scroll-btn" id="scrollBtn" onclick="scrollToDemotionZone()" title="Scroll to Demotion Zone">🔻</div>
    <div class="user-footer" id="footer">Loading your rank...</div>

    <!-- MAIN ANALYSIS MODAL (Empty shells for JS to populate) -->
    <div class="modal-overlay" id="analysisModal" onclick="closeModal(event)">
        <!-- The JS dynamically injects the modal content here when a user taps a profile -->
        <!-- We stripped the hardcoded HTML here because app.js handles it! -->
    </div>

    <!-- HISTORY ARCHIVE MODAL -->
    <div class="modal-overlay" id="historyModalOverlay" onclick="closeHistoryModal(event)" style="z-index: 200;">
        <!-- The JS dynamically injects the history content here -->
    </div>

    <!-- ELO LEADERBOARD MODAL -->
    <div class="modal-overlay" id="eloModalOverlay" onclick="closeEloModal(event)" style="z-index: 300;">
        <div class="modal-content" id="eloModalContent" onclick="event.stopPropagation()" style="height: 80vh; background: #f8fafc; padding: 0; display: flex; flex-direction: column;">
            <div style="padding: 20px; text-align: center; border-bottom: 1px solid #e2e8f0; background: white; border-radius: 32px 32px 0 0;">
                <div class="close-indicator" onclick="closeEloModal(null, true)"></div>
                <h2 style="margin: 0; color: #0f172a; font-size: 1.3em;">🌍 Global Intelligence</h2>
                <p style="margin: 4px 0 0 0; font-size: 0.8em; color: #64748b;">Top 50 Lifetime Elo Ratings</p>
            </div>
            <div id="eloListContainer" style="flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px;"></div>
            <div class="user-footer" id="eloFooter" style="bottom: 20px; background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; color: white;">
                Loading your Elo status...
            </div>
        </div>
    </div>
</body>
</html>
